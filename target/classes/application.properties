# ================================================================
# DataSource — PostgreSQL (Docker: docker-compose up -d)
# ================================================================
spring.datasource.url=jdbc:postgresql://localhost:5450/learn
spring.datasource.username=learn
spring.datasource.password=learn
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================================================
# JPA / Hibernate
# ddl-auto=none — схемой управляет Liquibase, не Hibernate!
# ================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================================================================
# Liquibase
# ================================================================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
server.port=8081
